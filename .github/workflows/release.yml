name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Use published browser-rest-api for sidecar
        shell: pwsh
        run: |
          $pkg = Get-Content src-tauri/sidecar/package.json -Raw | ConvertFrom-Json
          $pkg.dependencies.'browser-rest-api' = '^1.0.0'
          ($pkg | ConvertTo-Json -Depth 20) | Set-Content src-tauri/sidecar/package.json -Encoding utf8

      - name: Install frontend dependencies
        run: npm ci

      # npm install (not ci): package.json was rewritten above; lock still has file: browser-api
      - name: Install sidecar dependencies
        working-directory: src-tauri/sidecar
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'F95 App ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
