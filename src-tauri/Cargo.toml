[package]
name = "f95-app"
version = "1.8.1"
description = "Cliente desktop para F95Zone"
authors = ["F95 App"]
license = "GPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "f95_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable", "tray-icon", "image-png", "image-ico"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-stronghold = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_pickle = { package = "serde-pickle", path = "vendor/serde-pickle" }
thiserror = "1"
tokio = { version = "1", features = ["process", "io-util", "fs", "sync", "macros", "time", "rt"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "gzip", "brotli", "json", "cookies"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate", "deflate64", "bzip2", "zstd"] }
sevenz-rust2 = "0.13"
unrar = "0.5"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
base64 = "0.22"
quick-xml = "0.41"
flate2 = "1"
aes = "0.8"
cbc = "0.1"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
getrandom = { version = "0.2", features = ["std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
walkdir = "2"
fs4 = "0.13"
mega = { version = "0.8", features = ["reqwest"] }
sluice = "0.5"
futures = "0.3"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crc32fast = "1"
lz-str = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }



